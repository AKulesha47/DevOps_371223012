---
- name: Configure base for all servers
  hosts: all
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Configure PostgreSQL database
  hosts: db
  become: true

  vars:
    db_name: notes
    db_user: notes
    db_password: notes_lab_password

  tasks:
    - name: Install PostgreSQL and Python PostgreSQL adapter
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present
        update_cache: true

    - name: Configure PostgreSQL listening address
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow remote PostgreSQL connections
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: 'host all all 0.0.0.0/0 scram-sha-256'
      notify: Restart PostgreSQL

    - name: Create PostgreSQL user
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        state: present

    - name: Create PostgreSQL database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Configure web servers
  hosts: web
  become: true

  vars:
    database_url: "postgresql://notes:notes_lab_password@db:5432/notes"

  tasks:
    - name: Install web server dependencies
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging
          - git
        state: present
        update_cache: true

    - name: Clone notes repository
      ansible.builtin.git:
        repo: "https://github.com/AKulesha47/DevOps_371223012.git"
        dest: /opt/notes
        version: main
      notify: Restart notes

    - name: Install Python requirements
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv

    - name: Configure notes systemd service
      ansible.builtin.template:
        src: templates/notes.service.j2
        dest: /etc/systemd/system/notes.service
      notify: Restart notes

    - name: Start and enable notes service
      ansible.builtin.systemd:
        name: notes
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart notes
      ansible.builtin.service:
        name: notes
        state: restarted
